<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1c30"/><stop offset="1" stop-color="#173f63"/></linearGradient>
<linearGradient id="tealg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fb8ac"/><stop offset="1" stop-color="#7fe0d4"/></linearGradient>
<linearGradient id="tealv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fe0d4"/><stop offset="1" stop-color="#2fb8ac"/></linearGradient>
<linearGradient id="amberg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2a541"/><stop offset="1" stop-color="#ffc978"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".11"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7fe0d4" stop-opacity=".30"/><stop offset="1" stop-color="#7fe0d4" stop-opacity="0"/></radialGradient>
<radialGradient id="glowA" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f2a541" stop-opacity=".35"/><stop offset="1" stop-color="#f2a541" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#7fe0d4" stroke-opacity=".07"/></pattern>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>
</defs><rect width="480" height="300" fill="url(#bg)"/><rect width="480" height="300" fill="url(#grid)"/><circle cx="160" cy="150" r="190" fill="url(#glow)"/>

<!-- Panneau principal : baie de serveurs -->
<rect x="24" y="32" width="336" height="222" rx="10" fill="#0d2540" filter="url(#shadow)"/>
<rect x="24" y="32" width="336" height="222" rx="10" fill="url(#panel)" stroke="#7fe0d4" stroke-width="1.2" stroke-opacity="0.4"/>

<!-- 4 unités de serveur empilées -->
<g>
  <rect x="48" y="52" width="288" height="40" rx="6" fill="#0a1c30" stroke="#7fe0d4" stroke-width="1" stroke-opacity="0.35"/>
  <circle cx="66" cy="72" r="5" fill="url(#tealv)"/>
  <circle cx="82" cy="72" r="5" fill="#2fb8ac" fill-opacity="0.4"/>
  <rect x="100" y="68" width="140" height="8" rx="4" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="290" y="64" width="30" height="16" rx="4" fill="#2fb8ac" fill-opacity="0.22" stroke="#2fb8ac" stroke-opacity="0.7"/>
</g>
<g>
  <rect x="48" y="100" width="288" height="40" rx="6" fill="#0a1c30" stroke="#7fe0d4" stroke-width="1" stroke-opacity="0.35"/>
  <circle cx="66" cy="120" r="5" fill="url(#amberg)"/>
  <circle cx="82" cy="120" r="5" fill="#2fb8ac" fill-opacity="0.4"/>
  <rect x="100" y="116" width="110" height="8" rx="4" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="290" y="112" width="30" height="16" rx="4" fill="#f2a541" fill-opacity="0.22" stroke="#f2a541" stroke-opacity="0.7"/>
</g>
<g>
  <rect x="48" y="148" width="288" height="40" rx="6" fill="#0a1c30" stroke="#7fe0d4" stroke-width="1" stroke-opacity="0.35"/>
  <circle cx="66" cy="168" r="5" fill="url(#tealv)"/>
  <circle cx="82" cy="168" r="5" fill="#2fb8ac" fill-opacity="0.4"/>
  <rect x="100" y="164" width="160" height="8" rx="4" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="290" y="160" width="30" height="16" rx="4" fill="#2fb8ac" fill-opacity="0.22" stroke="#2fb8ac" stroke-opacity="0.7"/>
</g>
<g>
  <rect x="48" y="196" width="288" height="40" rx="6" fill="#0a1c30" stroke="#7fe0d4" stroke-width="1" stroke-opacity="0.35"/>
  <circle cx="66" cy="216" r="5" fill="url(#tealv)"/>
  <circle cx="82" cy="216" r="5" fill="#2fb8ac" fill-opacity="0.4"/>
  <rect x="100" y="212" width="90" height="8" rx="4" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="290" y="208" width="30" height="16" rx="4" fill="#2fb8ac" fill-opacity="0.22" stroke="#2fb8ac" stroke-opacity="0.7"/>
</g>

<!-- Panneau haut droite : nuage / cloud -->
<rect x="344" y="24" width="116" height="104" rx="10" fill="#0d2540" filter="url(#shadow)"/>
<rect x="344" y="24" width="116" height="104" rx="10" fill="url(#panel)" stroke="#7fe0d4" stroke-width="1.2" stroke-opacity="0.4"/>
<path d="M378 92c-10 0-18-8-18-17 0-8 6-15 14-17 3-10 12-17 23-17 12 0 22 9 24 20 9 1 16 8 16 17 0 10-8 18-18 18z" fill="none" stroke="url(#tealg)" stroke-width="4" stroke-linejoin="round"/>
<circle cx="402" cy="40" r="5" fill="#f2a541"/>

<!-- Panneau bas droite : disponibilité (anneau) -->
<rect x="344" y="148" width="116" height="116" rx="10" fill="#0d2540" filter="url(#shadow)"/>
<rect x="344" y="148" width="116" height="116" rx="10" fill="url(#panel)" stroke="#7fe0d4" stroke-width="1.2" stroke-opacity="0.4"/>
<circle cx="384" cy="206" r="24" fill="none" stroke="#2fb8ac" stroke-width="8" stroke-opacity="0.22"/>
<circle cx="384" cy="206" r="24" fill="none" stroke="#7fe0d4" stroke-width="8" stroke-linecap="round" stroke-dasharray="145 5" transform="rotate(-90 384 206)"/>
<rect x="418" y="194" width="32" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.7"/>
<rect x="418" y="208" width="26" height="4" rx="2.0" fill="#7fe0d4" fill-opacity="0.5"/>
<rect x="360" y="246" width="84" height="4" rx="2.0" fill="#7fe0d4" fill-opacity="0.35"/>
</svg>
